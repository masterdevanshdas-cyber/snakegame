<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4ade80">
    <title>Snake Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-food {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes snake-eat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .animate-pulse-food {
            animation: pulse-food 1s ease-in-out infinite;
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }

        .animate-slide-up {
            animation: slide-up 0.3s ease-out;
        }

        .animate-snake-eat {
            animation: snake-eat 0.2s ease-out;
        }

        .touch-none {
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-900 to-gray-800">
    <div id="root"></div>

    <script>
        // Game State
        const GRID_SIZE = 20;
        const SPEEDS = { easy: 180, medium: 120, hard: 70 };
        const INITIAL_SNAKE = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 },
        ];

        let snake = [...INITIAL_SNAKE];
        let food = getRandomFood(snake);
        let direction = 'RIGHT';
        let gameState = 'IDLE';
        let score = 0;
        let difficulty = 'medium';
        let highScores = {
            easy: parseInt(localStorage.getItem('snake-highscore-easy') || '0'),
            medium: parseInt(localStorage.getItem('snake-highscore-medium') || '0'),
            hard: parseInt(localStorage.getItem('snake-highscore-hard') || '0')
        };
        let showEatAnimation = false;
        let gameLoop = null;

        function getRandomFood(snake) {
            let food;
            do {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE),
                };
            } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
            return food;
        }

        function moveSnake() {
            if (gameState !== 'PLAYING') return;

            const head = snake[0];
            let newHead;
            switch (direction) {
                case 'UP': newHead = { x: head.x, y: head.y - 1 }; break;
                case 'DOWN': newHead = { x: head.x, y: head.y + 1 }; break;
                case 'LEFT': newHead = { x: head.x - 1, y: head.y }; break;
                case 'RIGHT': newHead = { x: head.x + 1, y: head.y }; break;
            }

            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                gameState = 'GAME_OVER';
                render();
                return;
            }

            if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                gameState = 'GAME_OVER';
                render();
                return;
            }

            const newSnake = [newHead, ...snake];

            if (newHead.x === food.x && newHead.y === food.y) {
                score += (difficulty === 'hard' ? 3 : difficulty === 'medium' ? 2 : 1);
                food = getRandomFood(newSnake);
                showEatAnimation = true;
                setTimeout(() => { showEatAnimation = false; render(); }, 200);

                if (score > highScores[difficulty]) {
                    highScores[difficulty] = score;
                    localStorage.setItem(`snake-highscore-${difficulty}`, score.toString());
                }
            } else {
                newSnake.pop();
            }

            snake = newSnake;
            render();
        }

        function startGame() {
            snake = [...INITIAL_SNAKE];
            food = getRandomFood(snake);
            direction = 'RIGHT';
            score = 0;
            gameState = 'PLAYING';
            render();
        }

        function resetGame() {
            snake = [...INITIAL_SNAKE];
            food = getRandomFood(snake);
            direction = 'RIGHT';
            score = 0;
            gameState = 'IDLE';
            render();
        }

        function togglePause() {
            if (gameState === 'PLAYING') gameState = 'PAUSED';
            else if (gameState === 'PAUSED') gameState = 'PLAYING';
            render();
        }

        function handleDirection(dir) {
            if (gameState !== 'PLAYING') return;
            if (dir === 'UP' && direction !== 'DOWN') direction = 'UP';
            if (dir === 'DOWN' && direction !== 'UP') direction = 'DOWN';
            if (dir === 'LEFT' && direction !== 'RIGHT') direction = 'LEFT';
            if (dir === 'RIGHT' && direction !== 'LEFT') direction = 'RIGHT';
        }

        function render() {
            if (gameLoop) clearInterval(gameLoop);
            if (gameState === 'PLAYING') {
                gameLoop = setInterval(moveSnake, SPEEDS[difficulty]);
            }

            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-4 select-none">
                    <div class="w-full max-w-lg mb-4 animate-fade-in">
                        <h1 class="text-3xl md:text-4xl font-bold text-center text-green-400 mb-2 tracking-wider">
                            🐍 SNAKE
                        </h1>
                        <div class="flex justify-between items-center mb-3 px-2">
                            <div class="text-center">
                                <div class="text-xs text-gray-400 uppercase tracking-wide">Score</div>
                                <div class="text-2xl font-bold text-white ${showEatAnimation ? 'animate-snake-eat' : ''}">
                                    ${score}
                                </div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-gray-400 uppercase tracking-wide">Difficulty</div>
                                <div class="text-sm text-green-300 font-medium capitalize">${difficulty}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-gray-400 uppercase tracking-wide">Best</div>
                                <div class="text-2xl font-bold text-yellow-400">${highScores[difficulty]}</div>
                            </div>
                        </div>
                    </div>

                    <div class="relative w-full max-w-lg aspect-square bg-gray-900/80 rounded-xl border-2 border-green-500/30 shadow-2xl shadow-green-500/10 overflow-hidden touch-none" id="game-board">
                        <div class="w-full h-full grid gap-px p-1" style="grid-template-columns: repeat(${GRID_SIZE}, 1fr); grid-template-rows: repeat(${GRID_SIZE}, 1fr);">
                            ${renderBoard()}
                        </div>
                        ${renderOverlay()}
                    </div>

                    <div class="w-full max-w-lg mt-4 animate-slide-up">
                        <div class="flex justify-center gap-3 mb-4">
                            ${gameState === 'PLAYING' ? '<button onclick="togglePause()" class="px-4 py-2 bg-yellow-500/20 border border-yellow-500/50 text-yellow-400 rounded-lg hover:bg-yellow-500/30 transition-all text-sm font-medium">⏸ Pause</button>' : ''}
                            ${gameState === 'PAUSED' ? '<button onclick="togglePause()" class="px-4 py-2 bg-green-500/20 border border-green-500/50 text-green-400 rounded-lg hover:bg-green-500/30 transition-all text-sm font-medium">▶ Resume</button>' : ''}
                            ${(gameState === 'PLAYING' || gameState === 'PAUSED') ? '<button onclick="resetGame()" class="px-4 py-2 bg-red-500/20 border border-red-500/50 text-red-400 rounded-lg hover:bg-red-500/30 transition-all text-sm font-medium">🔄 Restart</button>' : ''}
                        </div>

                        <div class="flex justify-center gap-2 mb-4">
                            ${['easy', 'medium', 'hard'].map(d => `
                                <button onclick="setDifficulty('${d}')" ${gameState === 'PLAYING' || gameState === 'PAUSED' ? 'disabled' : ''} class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${
                                    difficulty === d
                                        ? d === 'easy' ? 'bg-green-500/30 border border-green-500 text-green-400'
                                        : d === 'medium' ? 'bg-yellow-500/30 border border-yellow-500 text-yellow-400'
                                        : 'bg-red-500/30 border border-red-500 text-red-400'
                                        : 'bg-gray-700/50 border border-gray-600 text-gray-400 hover:border-gray-400'
                                } ${gameState === 'PLAYING' || gameState === 'PAUSED' ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}">
                                    ${d.charAt(0).toUpperCase() + d.slice(1)}
                                </button>
                            `).join('')}
                        </div>

                        <div class="flex justify-center md:hidden">
                            <div class="grid grid-cols-3 gap-1 w-40">
                                <div></div>
                                <button ontouchstart="event.preventDefault(); handleDirection('UP')" class="w-12 h-12 bg-gray-700/80 border border-gray-600 rounded-lg flex items-center justify-center text-white text-xl active:bg-green-500/50 active:border-green-500 transition-all mx-auto">↑</button>
                                <div></div>
                                <button ontouchstart="event.preventDefault(); handleDirection('LEFT')" class="w-12 h-12 bg-gray-700/80 border border-gray-600 rounded-lg flex items-center justify-center text-white text-xl active:bg-green-500/50 active:border-green-500 transition-all mx-auto">←</button>
                                <div class="w-12 h-12 flex items-center justify-center"><div class="w-3 h-3 bg-green-500/50 rounded-full"></div></div>
                                <button ontouchstart="event.preventDefault(); handleDirection('RIGHT')" class="w-12 h-12 bg-gray-700/80 border border-gray-600 rounded-lg flex items-center justify-center text-white text-xl active:bg-green-500/50 active:border-green-500 transition-all mx-auto">→</button>
                                <div></div>
                                <button ontouchstart="event.preventDefault(); handleDirection('DOWN')" class="w-12 h-12 bg-gray-700/80 border border-gray-600 rounded-lg flex items-center justify-center text-white text-xl active:bg-green-500/50 active:border-green-500 transition-all mx-auto">↓</button>
                                <div></div>
                            </div>
                        </div>

                        <div class="hidden md:flex justify-center gap-4 text-xs text-gray-500 mt-2">
                            <span>↑↓←→ / WASD: Move</span>
                            <span>Space: Pause</span>
                            <span>R: Restart</span>
                        </div>
                    </div>
                </div>
            `;

            setupTouchControls();
        }

        function renderBoard() {
            let cells = '';
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const isSnakeHead = snake[0].x === x && snake[0].y === y;
                    const snakeIndex = snake.findIndex(seg => seg.x === x && seg.y === y);
                    const isSnakeBody = snakeIndex > 0;
                    const isFood = food.x === x && food.y === y;

                    let cellClass = 'w-full h-full rounded-sm transition-all duration-75 ';

                    if (isSnakeHead) {
                        cellClass += `bg-green-400 shadow-lg shadow-green-400/50 ${showEatAnimation ? 'animate-snake-eat' : ''}`;
                    } else if (isSnakeBody) {
                        const opacity = Math.max(0.4, 1 - snakeIndex * 0.03);
                        cells += `<div class="bg-green-500 rounded-sm" style="opacity: ${opacity}"></div>`;
                        continue;
                    } else if (isFood) {
                        cellClass += 'bg-red-400 rounded-full animate-pulse-food shadow-lg shadow-red-400/50';
                    } else {
                        cellClass += (x + y) % 2 === 0 ? 'bg-gray-800/30' : 'bg-gray-800/10';
                    }

                    cells += `<div class="${cellClass}"></div>`;
                }
            }
            return cells;
        }

        function renderOverlay() {
            if (gameState === 'IDLE') {
                return `
                    <div class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center animate-fade-in backdrop-blur-sm">
                        <div class="text-6xl mb-4">🐍</div>
                        <h2 class="text-2xl font-bold text-white mb-2">Ready to Play?</h2>
                        <p class="text-gray-300 text-sm mb-6 text-center px-4">Use arrow keys, WASD, or swipe to control</p>
                        <button onclick="startGame()" class="px-8 py-3 bg-green-500 hover:bg-green-400 text-white font-bold rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg shadow-green-500/30">Start Game</button>
                    </div>
                `;
            } else if (gameState === 'PAUSED') {
                return `
                    <div class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center animate-fade-in backdrop-blur-sm">
                        <div class="text-5xl mb-4">⏸️</div>
                        <h2 class="text-2xl font-bold text-white mb-4">Paused</h2>
                        <button onclick="togglePause()" class="px-8 py-3 bg-green-500 hover:bg-green-400 text-white font-bold rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg shadow-green-500/30">Resume</button>
                    </div>
                `;
            } else if (gameState === 'GAME_OVER') {
                return `
                    <div class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center animate-fade-in backdrop-blur-sm">
                        <div class="text-5xl mb-3">💀</div>
                        <h2 class="text-2xl font-bold text-red-400 mb-1">Game Over!</h2>
                        <p class="text-white text-lg mb-1">Score: <span class="font-bold text-green-400">${score}</span></p>
                        ${score >= highScores[difficulty] && score > 0 ? '<p class="text-yellow-400 text-sm mb-3 animate-pulse">🏆 New High Score!</p>' : ''}
                        <div class="flex gap-3 mt-3">
                            <button onclick="startGame()" class="px-6 py-3 bg-green-500 hover:bg-green-400 text-white font-bold rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg shadow-green-500/30">Play Again</button>
                            <button onclick="resetGame()" class="px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-lg transition-all duration-200 transform hover:scale-105">Menu</button>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function setDifficulty(d) {
            if (gameState === 'IDLE' || gameState === 'GAME_OVER') {
                difficulty = d;
                render();
            }
        }

        let touchStart = null;
        function setupTouchControls() {
            const board = document.getElementById('game-board');
            if (!board) return;

            board.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStart = { x: touch.clientX, y: touch.clientY };
            });

            board.addEventListener('touchend', (e) => {
                if (!touchStart) return;
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStart.x;
                const dy = touch.clientY - touchStart.y;
                const minSwipe = 30;

                if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;

                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) handleDirection('RIGHT');
                    else handleDirection('LEFT');
                } else {
                    if (dy > 0) handleDirection('DOWN');
                    else handleDirection('UP');
                }
                touchStart = null;
            });
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
                e.preventDefault();
            }

            if (key === ' ' || key === 'Escape') {
                if (gameState === 'PLAYING') togglePause();
                else if (gameState === 'PAUSED') togglePause();
                else if (gameState === 'IDLE') startGame();
                return;
            }

            if (key === 'r' || key === 'R') {
                resetGame();
                return;
            }

            if (gameState !== 'PLAYING') return;

            switch (key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    handleDirection('UP');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    handleDirection('DOWN');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    handleDirection('LEFT');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    handleDirection('RIGHT');
                    break;
            }
        });

        render();
    </script>
</body>
</html>
